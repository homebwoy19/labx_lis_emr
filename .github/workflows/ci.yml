name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab_backend

    env:
      # Dummy values so the fail-fast config loader is satisfied in CI. No real
      # database is required — the unit test suite is DB-free.
      NODE_ENV: test
      DATABASE_URL: postgresql://user:pass@localhost:5432/lis_test
      JWT_ACCESS_SECRET: ci_access_secret_key_at_least_32_chars_long
      JWT_REFRESH_SECRET: ci_refresh_secret_key_at_least_32_chars_long

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: lab_backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: lab_backend
          push: false
          tags: foundation-lab-lis:ci
